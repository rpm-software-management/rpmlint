# Configuration for the rpmlint utility.

# Configuration options used by the checks
CompressExtension = "gz"
UseVarLockSubsys = false
UseVersionInChangelog = false
BadnessThreshold = 999

# Set to true to issue a warning for ghost entries outside snapshots
# when checking for atomic update compatibility
AtomicCheckGhosts = false

# Enabled checks for the rpmlint to be run (besides the default set)
Checks = [
    "BashismsCheck",
    "PAMModulesCheck",
    "TmpFilesCheck",
    "SysVInitOnSystemdCheck",
    "SharedLibraryPolicyCheck",
    "AtomicUpdateCheck",
]

# Library names whose trailing digits are part of the upstream project name
# rather than a version number; BuildRequires on their -devel packages is
# legitimate and must not trigger invalid-build-requires.
#
# Generated from the openSUSE Tumbleweed 2026-09-21 package set: every
# lib<stem><digits>-devel name was compared against its source package name,
# and entries where the digits are baked into the source/upstream naming
# (rather than a distro-added version suffix) were kept. Names covered by the
# programmatic rules in TagsCheck (toolkit generations, x11, the boost
# versioning scheme) are not listed here, except for the three boost-defaults
# python3 flavor names, which carry digits but do not follow the versioned
# scheme.
